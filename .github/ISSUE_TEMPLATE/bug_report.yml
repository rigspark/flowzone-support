name: Bug report
description: Something in FlowZone isn't working as described.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Sorry it's misbehaving. The more detail you give, the faster we can fix it. Please don't include personal information: this issue is public.
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open youtube.com/…
        2. Scroll to…
        3. See…
    validations:
      required: true
  - type: dropdown
    id: page
    attributes:
      label: Where on YouTube?
      multiple: true
      options:
        - Home feed
        - Search results
        - Watch page / suggestions
        - Channel page
        - Shorts link
        - Subscriptions
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FlowZone version
      description: Shown in chrome://extensions under FlowZone.
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser, version and OS
      placeholder: Chrome 131 on macOS 15
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Which FlowZone switches are on?
      placeholder: Hide AI videos, Hide Shorts, Catch unlabelled AI…
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video
      description: Drag images in here.
